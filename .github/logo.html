<!doctype html>
<!-- Source of the README logo. Screenshot with headless Chrome at 2x and a transparent background:
     ?theme=dark for the dark variant, ?icon for the square plugin icon. -->
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&display=swap" rel="stylesheet">
<style>
  :root { --ink: #0f1b3d; --accent: #ef1d47; --halo: #fde4ea; --lens: #ffffff; --rule: #cfd5e1; }
  :root.dark { --ink: #e6eaf3; --accent: #ff4d6d; --halo: #3a1f2b; --lens: #0d1117; --rule: #3a4252; }
  html, body { margin: 0; background: transparent; }
  .logo { display: inline-flex; align-items: center; gap: 28px; padding: 12px 16px; }
  .logo svg { width: 112px; height: 112px; flex: none; }
  .rule { width: 2px; height: 76px; background: var(--rule); border-radius: 1px; }
  .name { font: 800 56px/1 'Archivo', sans-serif; letter-spacing: -.015em; color: var(--ink); white-space: nowrap; padding-bottom: 6px; }
  .name span { color: var(--accent); }
  :root.icon .rule, :root.icon .name { display: none; }
  :root.icon .logo { padding: 0; }
  :root.icon .logo svg { width: 512px; height: 512px; }
</style>
<div class="logo">
  <svg viewBox="0 0 120 120" aria-hidden="true">
    <circle cx="54" cy="60" r="44" fill="var(--halo)"/>
    <g fill="none" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M14 104V60l22-8"/>
      <path d="M36 104V30l30-12v44"/>
      <path d="M8 104h52"/>
    </g>
    <g fill="var(--ink)">
      <rect x="20" y="66" width="7" height="7" rx="1"/><rect x="20" y="82" width="7" height="7" rx="1"/>
      <rect x="43" y="38" width="7" height="7" rx="1"/><rect x="54" y="34" width="7" height="7" rx="1"/>
      <rect x="43" y="52" width="7" height="7" rx="1"/><rect x="54" y="48" width="7" height="7" rx="1"/>
      <rect x="43" y="66" width="7" height="7" rx="1"/>
      <path d="M43 104V88h12v16z"/>
    </g>
    <circle cx="78" cy="80" r="17" fill="var(--lens)" stroke="var(--ink)" stroke-width="4"/>
    <path d="M90.5 92.5l12 12" stroke="var(--ink)" stroke-width="8" stroke-linecap="round"/>
    <path d="M70.5 80.5l5.5 5.5 10-11" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="rule"></div>
  <div class="name">Company background <span>check</span></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('theme') === 'dark') document.documentElement.classList.add('dark');
  if (q.has('icon')) document.documentElement.classList.add('icon');
</script>
