<!doctype html>
<!-- Source of the README logo. Screenshot with headless Chrome at 2x and a transparent background:
     ?theme=dark for the dark variant, ?icon for the square plugin icon. -->
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&display=swap" rel="stylesheet">
<style>
  :root { --ink: #0f1b3d; --accent: #ef1d47; --halo: #fde4ea; --fill: #ffffff; }
  :root.dark { --ink: #e6eaf3; --accent: #ff4d6d; --halo: #3a1f2b; --fill: #0d1117; }
  html, body { margin: 0; background: transparent; }
  .logo { display: inline-flex; align-items: center; gap: 22px; padding: 12px 16px; }
  .logo svg { width: 130px; height: 120px; flex: none; }
  .name { font: 800 56px/1 'Archivo', sans-serif; letter-spacing: -.015em; color: var(--ink); white-space: nowrap; padding-bottom: 6px; }
  .name span { color: var(--accent); }
  :root.icon .name { display: none; }
  :root.icon .logo { padding: 0; }
  :root.icon .logo svg { width: 512px; height: 512px; }
</style>
<div class="logo">
  <svg viewBox="5 0 250 240" aria-hidden="true">
    <circle cx="118" cy="121" r="111" fill="var(--halo)"/>
    <g fill="var(--fill)" stroke="var(--ink)" stroke-width="7" stroke-linejoin="round">
      <path d="M27 202V122q0-4 4-5.5L79 101V202z"/>
      <path d="M79 202V73q0-4 4-5.5l85-33q4-1.5 4 3V202z"/>
    </g>
    <g fill="var(--ink)">
      <rect x="44" y="136" width="15" height="15" rx="2"/><rect x="44" y="166" width="15" height="15" rx="2"/>
      <path d="M121 87V77a7 7 0 0 1 14 0v10z"/><rect x="143" y="70" width="15" height="15" rx="2"/>
      <rect x="95" y="97" width="15" height="15" rx="2"/><rect x="120" y="97" width="15" height="15" rx="2"/><rect x="143" y="97" width="15" height="15" rx="2"/>
      <rect x="95" y="129" width="15" height="15" rx="2"/><rect x="120" y="129" width="15" height="15" rx="2"/>
      <path d="M102 202v-32q0-3 3-3h22q3 0 3 3v32z"/>
    </g>
    <path d="M15 202h150" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"/>
    <path d="M211 182l26 28" stroke="var(--ink)" stroke-width="14" stroke-linecap="round"/>
    <circle cx="182" cy="149" r="38" fill="var(--fill)" stroke="var(--ink)" stroke-width="7"/>
    <path d="M164 159l12 13 22-25" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="name">Company background <span>check</span></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('theme') === 'dark') document.documentElement.classList.add('dark');
  if (q.has('icon')) document.documentElement.classList.add('icon');
</script>
